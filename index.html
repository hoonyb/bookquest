<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D6E9F8">
<meta name="description" content="책 한 권이 퀘스트 하나 — 위시·읽는 중·완독으로 쌓는 나의 독서 이력">
<link rel="preload" href="fonts/Galmuri11.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script>window.BQ_SYNC=true</script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>북퀘스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 만화 책장 — 연보라 도트 바탕, 굵은 외곽선과 오프셋 그림자의 스티커 같은 책·카드, 동글한 글씨, 통통 튀는 움직임 */
:root{
  --bg:#F3EEFF; --dot:#E2D9FF; --surface:#FFFFFF; --fg:#2B2440; --muted:#7A7194; --line:#2B2440; --soft:#E9E3FA;
  --outline:#2B2440; --wood:#F2B47A; --wood-hi:#FFD3A6;
  --accent:#7C5CFF; --accent-soft:#E6DEFF; --on-accent:#FFFFFF; --hl:#FFE27A; --pink:#FF7EB0;
  --k1:#FFE3EE; --k2:#DDF5FF; --k3:#E4FBE6; --k4:#FFF1CF;
  --heat-0:#ECE6FB; --heat-1:#CDBDFF; --heat-2:#9C82FF; --heat-3:#6A45F5;
  --warn:#C9600E; --warn-soft:#FFE6C7; --danger:#E0466B;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1730; --dot:#28213F; --surface:#2A2344; --fg:#F4EFFF; --muted:#ADA3C9; --line:#0F0B1C; --soft:#352D52;
  --outline:#0F0B1C; --wood:#C98A55; --wood-hi:#E2A974;
  --accent:#A994FF; --accent-soft:#3A3063; --on-accent:#140F26; --hl:#6A5A1E; --pink:#FF8CBB;
  --k1:#4A2A3D; --k2:#22394A; --k3:#243F2C; --k4:#463A1E;
  --heat-0:#2E2749; --heat-1:#4B3C8C; --heat-2:#7A62E0; --heat-3:#C4B5FF;
  --warn:#FFB066; --warn-soft:#4A3418; --danger:#FF7D9A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1730; --dot:#28213F; --surface:#2A2344; --fg:#F4EFFF; --muted:#ADA3C9; --line:#0F0B1C; --soft:#352D52;
  --outline:#0F0B1C; --wood:#C98A55; --wood-hi:#E2A974;
  --accent:#A994FF; --accent-soft:#3A3063; --on-accent:#140F26; --hl:#6A5A1E; --pink:#FF8CBB;
  --k1:#4A2A3D; --k2:#22394A; --k3:#243F2C; --k4:#463A1E;
  --heat-0:#2E2749; --heat-1:#4B3C8C; --heat-2:#7A62E0; --heat-3:#C4B5FF;
  --warn:#FFB066; --warn-soft:#4A3418; --danger:#FF7D9A; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hbar{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:2.5px solid var(--outline);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:3px 3px 0 var(--outline)}
.brand{font-family:var(--display);font-size:24px;margin-right:auto;display:flex;align-items:center;gap:8px;line-height:1}
.brand .logo{display:flex;gap:2px;align-items:flex-end;height:22px}
.brand .logo i{display:block;width:6px;border-radius:3px 3px 1px 1px;border:2px solid var(--outline)}
.tabs{display:flex;gap:4px}
.tabs button{border:2px solid transparent;background:none;padding:5px 14px;border-radius:999px;font-family:var(--display);font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--on-accent);background:var(--accent);border-color:var(--outline)}
.ghost{border:0;background:none;padding:6px 10px;font-size:14px;color:var(--muted);font-family:var(--display)}

.banner{margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:2px dashed var(--muted);border-radius:16px;padding:10px 14px;font-size:14px;color:var(--muted)}
.banner b{color:var(--fg)}
.banner button{margin-left:auto;border:2px solid var(--outline);background:var(--hl);color:#2B2440;border-radius:999px;padding:4px 12px;font-size:13px;font-family:var(--display);box-shadow:2px 2px 0 var(--outline)}

.hero{margin:30px 0 6px;display:flex;align-items:flex-end;gap:14px 30px;flex-wrap:wrap}
.hero .big{font-family:var(--display);font-size:clamp(34px,7vw,54px);line-height:1.15;text-wrap:balance}
.hero .big em{font-style:normal;color:var(--accent);background:linear-gradient(transparent 62%,var(--hl) 62% 92%,transparent 92%);padding:0 4px}
.hero .sub{color:var(--muted);font-size:15px;padding-bottom:8px}
.hero .wave{display:inline-block;transform-origin:70% 80%;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--outline);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;font-family:var(--display);transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);box-shadow:2px 2px 0 var(--accent)}
.chip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums;font-size:12px}
.viewtog{margin-left:auto;display:flex;background:var(--surface);border:2px solid var(--outline);border-radius:999px;padding:2px;box-shadow:2px 2px 0 var(--outline)}
.viewtog button{border:0;background:none;padding:3px 12px;font-size:14px;color:var(--muted);border-radius:999px;font-family:var(--display)}
.viewtog button[aria-pressed="true"]{background:var(--hl);color:#2B2440}

/* ── 책장 ── */
.section{margin:30px 0 8px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec-h h2{font-family:var(--display);font-size:20px;margin:0;font-weight:400}
.sec-h span{font-family:var(--display);font-size:13px;min-width:24px;height:24px;display:inline-grid;place-items:center;border-radius:999px;background:var(--accent);color:var(--on-accent);border:2px solid var(--outline);padding:0 6px}
.sec-h hr{flex:1;border:0;border-top:2.5px dashed var(--soft);margin:0 0 0 6px}
.row{position:relative;display:flex;align-items:flex-end;gap:4px;min-height:214px;padding:0 10px;margin-bottom:40px}
.row::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:var(--wood);border:2.5px solid var(--outline);border-radius:9px;box-shadow:inset 0 4px 0 var(--wood-hi),0 5px 0 var(--outline);z-index:0}
.row>*{position:relative;z-index:1}
.empty-row{color:var(--muted);font-size:15px;align-self:center;font-family:var(--display)}

.spine{position:relative;border:2.5px solid var(--outline);padding:0;flex:none;overflow:hidden;border-radius:9px 9px 3px 3px;color:var(--ink);background:var(--c);
  display:flex;flex-direction:column;align-items:center;
  box-shadow:inset -6px 0 0 rgba(43,36,64,.10),inset 5px 0 0 rgba(255,255,255,.4);transform-origin:50% 100%}
.spine:hover,.spine:focus-visible{animation:wiggle .5s ease-in-out}
@keyframes wiggle{0%{transform:none}30%{transform:translateY(-12px) rotate(-3deg)}60%{transform:translateY(-8px) rotate(2.5deg)}100%{transform:translateY(-6px)}}
.spine:hover{transform:translateY(-6px)}
.anim .spine,.anim .cv{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes pop{0%{transform:translateY(-18px) scale(.94)}100%{transform:none}}
.spine .t{position:relative;z-index:1;writing-mode:vertical-rl;font-family:var(--display);font-size:14px;line-height:1.1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:16px;max-height:calc(100% - 70px)}
.spine .a{position:relative;z-index:1;writing-mode:vertical-rl;font-size:10px;letter-spacing:.05em;opacity:.75;white-space:nowrap;margin-top:auto;margin-bottom:24px;max-height:50px;overflow:hidden;font-weight:700}
.spine .pub{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--c2);border:2px solid var(--outline)}
.spine .pub.sq{border-radius:2px;transform:translateX(-50%) rotate(45deg)}
.spine .blk{position:absolute;left:0;right:0;background:var(--c2)}
.spine.v1 .blk{top:0;height:28%;border-bottom:2.5px solid var(--outline)}
.spine.v1 .t{margin-top:calc(28% + 10px);max-height:calc(72% - 76px)}
.spine.v2 .blk{bottom:0;height:20%;border-top:2.5px solid var(--outline)}
.spine.v2 .a{margin-bottom:calc(20% + 8px)}
.spine.v2 .pub{background:var(--c)}
.spine.v3 .ln{position:absolute;left:0;right:0;top:10px;height:9px;background:var(--c2);border-block:2px solid var(--outline)}
.spine.v3 .t{margin-top:28px}
.spine.v4 .ln{position:absolute;left:0;right:0;top:0;bottom:0;background:repeating-linear-gradient(180deg,transparent 0 12px,var(--c2) 12px 15px);opacity:.55}
.spine.v4 .t{background:var(--c);padding:5px 2px;border-radius:4px}
.spine .rib{position:absolute;top:-3px;right:3px;width:9px;height:26px;background:var(--pink);border:2px solid var(--outline);border-top:0;clip-path:polygon(0 0,100% 0,100% 100%,50% 74%,0 100%);z-index:3}
.spine .face{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);width:18px;height:12px;z-index:2}
.spine .face i{position:absolute;top:0;width:4px;height:5px;border-radius:50%;background:var(--outline)}
.spine .face i:first-child{left:1px}.spine .face i:nth-child(2){right:1px}
.spine .face b{position:absolute;left:50%;bottom:0;width:7px;height:4px;transform:translateX(-50%);border:2px solid var(--outline);border-top:0;border-radius:0 0 7px 7px}
.spine .face s{position:absolute;top:5px;width:5px;height:3px;border-radius:50%;background:var(--pink);opacity:.7}
.spine .face s:nth-of-type(1){left:-3px}.spine .face s:nth-of-type(2){right:-3px}
.spine.hasface .a{margin-bottom:50px}
.spine.hasface .pub{display:none}
.spine:hover .face i{animation:blink .5s}
@keyframes blink{40%{transform:scaleY(.1)}}

.plant{flex:none;width:44px;height:96px;margin-left:12px;position:relative}
.plant .pot{position:absolute;left:4px;bottom:0;width:36px;height:30px;background:#FF9F8A;border:2.5px solid var(--outline);border-radius:4px 4px 12px 12px}
.plant .pot::before{content:"";position:absolute;left:-5px;right:-5px;top:-4px;height:9px;background:#FFB7A6;border:2.5px solid var(--outline);border-radius:5px}
.plant .lf{position:absolute;bottom:26px;left:15px;width:15px;height:40px;background:#7AD58B;border:2.5px solid var(--outline);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}
.plant .lf.a1{transform:rotate(-34deg);height:34px;animation-delay:-.6s}
.plant .lf.a2{height:48px}
.plant .lf.a3{transform:rotate(32deg);height:30px;animation-delay:-1.3s}
@keyframes sway{0%,100%{rotate:-4deg}50%{rotate:5deg}}

.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:30px 22px;padding:4px 4px}
.cv{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.cv .art{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:8px 14px 14px 8px;overflow:hidden;border:2.5px solid var(--outline);box-shadow:5px 5px 0 var(--outline);transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s}
.cv .art::after{content:"";position:absolute;left:8px;top:0;bottom:0;width:2.5px;background:var(--outline);opacity:.25}
.cv:hover .art{transform:translate(-2px,-6px) rotate(-2deg);box-shadow:8px 10px 0 var(--outline)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .meta{font-size:13px;line-height:1.4;min-width:0}
.cv .meta b{display:block;font-family:var(--display);font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .meta span{color:var(--muted);font-size:12px}

/* 생성 표지 */
.gen{position:absolute;inset:0;background:var(--c);color:var(--ink);overflow:hidden;container-type:inline-size}
.gen .gt{font-family:var(--display);line-height:1.2;text-wrap:balance;word-break:keep-all}
.gen .ga{font-size:max(7px,7.5cqw);opacity:.8;font-weight:700}
.gen.g0{padding:13cqw 11cqw 11cqw 15cqw}
.gen.g0 .gt{font-size:14cqw;position:relative;z-index:1}
.gen.g0 .ga{position:absolute;left:15cqw;bottom:10cqw;z-index:1}
.gen.g0 .orb{position:absolute;width:80cqw;height:80cqw;border-radius:50%;background:var(--c2);border:2.5px solid var(--outline);right:-24cqw;bottom:-14cqw}
.gen.g0 .orb::before,.gen.g0 .orb::after{content:"";position:absolute;top:26%;width:7cqw;height:9cqw;border-radius:50%;background:var(--outline)}
.gen.g0 .orb::before{left:22%}.gen.g0 .orb::after{left:42%}
.gen.g1{display:flex;flex-direction:column}
.gen.g1 .top{flex:0 0 60%;background:var(--c);position:relative}
.gen.g1 .top::before{content:"★";position:absolute;right:12cqw;top:10cqw;font-size:22cqw;color:var(--c2);-webkit-text-stroke:2px var(--outline)}
.gen.g1 .bot{flex:1;background:#FFFBF4;color:#2B2440;padding:9cqw 10cqw 9cqw 14cqw;display:flex;flex-direction:column;gap:3cqw;border-top:2.5px solid var(--outline)}
.gen.g1 .gt{font-size:12cqw}
.gen.g1 .stripe{display:none}
.gen.g2{padding:11cqw 11cqw 11cqw 15cqw;display:flex;flex-direction:column}
.gen.g2 .glyph{font-family:var(--display);font-size:92cqw;line-height:.85;color:var(--c2);-webkit-text-stroke:2.5px var(--outline);position:absolute;left:4cqw;top:2cqw}
.gen.g2 .gt{font-size:12.5cqw;margin-top:auto;position:relative}
.gen.g2 .ga{position:relative;margin-top:3cqw}

.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(22px + env(safe-area-inset-bottom,0px));border:2.5px solid var(--outline);background:var(--pink);color:#2B2440;border-radius:999px;padding:12px 22px;font-family:var(--display);font-size:17px;box-shadow:4px 4px 0 var(--outline);z-index:6;display:flex;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s}
.fab:hover{transform:translate(-1px,-2px) rotate(-2deg);box-shadow:5px 6px 0 var(--outline)}
.fab:active,.btn:active,.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--outline)}
.fab span{font-size:22px;line-height:1}

/* ── 통계 ── */
.stats-top{display:flex;align-items:flex-end;gap:10px;margin:30px 0 6px;flex-wrap:wrap}
.stats-top h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;margin-right:auto;line-height:1.15}
select{border:2.5px solid var(--outline);background:var(--surface);border-radius:999px;padding:5px 12px;font-family:var(--display);box-shadow:2px 2px 0 var(--outline)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 30px}
.kpi{padding:14px 16px;border:2.5px solid var(--outline);border-radius:18px;box-shadow:4px 4px 0 var(--outline);min-width:0;background:var(--k1)}
.kpi:nth-child(2){background:var(--k2)}.kpi:nth-child(3){background:var(--k3)}.kpi:nth-child(4){background:var(--k4)}
.kpi .v{font-family:var(--display);font-size:clamp(30px,5vw,40px);font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .v small{font-family:var(--body);font-size:14px;color:var(--muted);margin-left:3px;font-weight:700}
.kpi .l{font-size:13px;color:var(--muted);margin-top:4px;font-weight:700}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.blk{min-width:0;background:var(--surface);border:2.5px solid var(--outline);border-radius:20px;box-shadow:4px 4px 0 var(--outline);padding:18px 18px 20px}
.blk h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0 0 14px}
.blk.full{grid-column:1/-1}

.goal{display:flex;flex-direction:column;gap:10px}
.goal .num{font-family:var(--display);font-size:30px}
.goal .num span{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:700}
.goal .shelfbar{display:flex;gap:3px;align-items:flex-end;flex-wrap:wrap}
.goal .shelfbar i{width:11px;height:30px;border-radius:4px 4px 2px 2px;background:var(--heat-0);border:2px solid var(--outline)}
.goal .shelfbar i.on{background:var(--accent)}
.goal .shelfbar i.on:nth-child(3n+2){background:var(--pink)}
.goal .shelfbar i.on:nth-child(3n){background:var(--hl)}
.goal .row2{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap;font-weight:700}
.goal input{width:56px;border:2px solid var(--outline);background:var(--bg);border-radius:8px;padding:1px 6px;text-align:right}

.months{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:170px;border-bottom:2.5px solid var(--outline);padding-top:18px}
.mcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.mcol .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:4px;font-family:var(--display)}
.mcol .b{width:100%;max-width:24px;background:var(--heat-2);border:2px solid var(--outline);border-bottom:0;border-radius:8px 8px 0 0}
.mcol .b[style*="height:0%"]{border:0}
.mcol.cur .b{background:var(--pink)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;font-size:12px;color:var(--muted);text-align:center;margin-top:6px;font-family:var(--display)}

.heat-scroll{overflow-x:auto;padding-bottom:6px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;width:max-content}
.heat i{border-radius:4px;background:var(--heat-0)}
.heat i.l1{background:var(--heat-1)}.heat i.l2{background:var(--heat-2)}
.heat i.l3{background:var(--heat-3);box-shadow:0 0 0 1.5px var(--outline)}
.heat i.out{background:transparent}
.heat-legend{display:flex;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap;font-weight:700}
.heat-legend i{width:13px;height:13px;border-radius:4px;display:inline-block}

.genre-bar{display:flex;height:38px;border-radius:12px;overflow:hidden;border:2.5px solid var(--outline);margin-bottom:16px}
.genre-bar i{display:block;height:100%}
.genre-bar i+i{border-left:2.5px solid var(--outline)}

<script>
(() => {
const KEY='chaekdeung.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const days=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const uid=()=>Math.random().toString(36).slice(2,10);
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};

/* 장르별 색 묶음 — 첫 색이 통계 색 */
const FAM={
 '소설':['#FF8A80','#FFC2B8','#FF6B6B','#FFE0D9'],
 '에세이':['#FFD166','#FFE7A3','#F7BE45','#FFF3CF'],
 '인문':['#6FA8FF','#ADCDFF','#5590F0','#DDEBFF'],
 '과학':['#5ED3B0','#A6ECD7','#3CC29A','#DAF7EE'],
 '역사':['#E3AE77','#F0CDA4','#CF9358','#F8E8D4'],
 'IT':['#9393F5','#C3C3FC','#7676E3','#E5E5FF'],
 '경제·경영':['#AEDD72','#D0EDA8','#8FCB4E','#EAF7DA'],
 '자기계발':['#C99AF2','#E2C8FB','#B07BE6','#F3E8FF'],
 '시':['#FF9EC7','#FFCADF','#F57CB0','#FFE7F1'],
 '철학':['#A9B1C2','#CDD2DD','#8B95AA','#E9ECF1'],
 '예술':['#FFA463','#FFC99F','#F78A3E','#FFE7D4'],
};
const GENRES=Object.keys(FAM);
const ALLC=Object.values(FAM);
const famOf=g=>FAM[g]||ALLC[hash(g||'기타')%ALLC.length];
const lum=hex=>{const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const f=v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4;return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const inkOn=hex=>lum(hex)>.22?'#2B2440':'#FFFBF4';
function look(b){const f=famOf(b.genre),h=hash(b.title+'|'+b.author);
  const ci=h%4, c=f[ci], c2=f[(ci+1+((h>>3)%2))%4];
  return {c,c2,ink:inkOn(c),ink2:inkOn(c2),v:(h>>6)%5,face:(h>>15)%3===0,g:(h>>9)%3,pub:(h>>12)%2}}

const spineH=b=>160+hash(b.title)%46;

const SAMPLE=[
 ['소년이 온다','한강','소설',216,'done','2026-01-28','2026-02-10'],
 ['작별하지 않는다','한강','소설',332,'done','2026-03-05','2026-03-22'],
 ['채식주의자','한강','소설',247,'done','2025-10-20','2025-11-03'],
 ['이처럼 사소한 것들','클레어 키건','소설',132,'done','2026-04-06','2026-04-12'],
 ['코스모스','칼 세이건','과학',719,'reading','2026-07-01',''],
 ['이기적 유전자','리처드 도킨스','과학',632,'done','2025-07-22','2025-08-20'],

let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.books))return Object.assign({goal:24,view:'spine',filter:'all',sample:false,skin:'pixel'},s)}catch(e){}
  return {books:SAMPLE,goal:24,view:'spine',filter:'all',sample:true,skin:'pixel'}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('저장 공간이 부족해요. 표지 이미지를 줄여 보세요.')}
  if(typeof scheduleSync==='function')scheduleSync()}

let tab='shelf';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1800)}

/* ───── 책장 ───── */
const SECTIONS=[['reading','읽는 중'],['done','완독'],['wish','위시']];
const STATUS_LABEL={wish:'위시',reading:'읽는 중',done:'완독'};
function sorted(st){const bs=state.books.filter(b=>b.status===st);
  if(st==='done')return bs.sort((a,b)=>(b.finishedAt||'').localeCompare(a.finishedAt||''));
  if(st==='reading')return bs.sort((a,b)=>(a.startedAt||'').localeCompare(b.startedAt||''));
  return bs.sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||''))}

function renderHero(){const y=String(new Date().getFullYear());
  const n=state.books.filter(b=>b.status==='done'&&(b.finishedAt||'').startsWith(y)).length;
  const r=state.books.filter(b=>b.status==='reading').length, w=state.books.filter(b=>b.status==='wish').length;
  $('#hero').innerHTML=`<div class="big">${y}년, <em>${n}권</em>이나<br>다 읽었어요 <span class="wave">👏</span></div><div class="sub">지금 ${r}권 읽는 중 · 읽고 싶은 책 ${w}권</div>${xpHTML(n)}`}
function xpHTML(n){const g=Math.max(1,state.goal),on=Math.min(12,Math.round(n/g*12));
  const t=n<5?'새싹 독자':n<12?'책벌레':n<24?'독서 용사':'전설의 사서';
  return `<div class="xp"><div class="lv">LV.${n} ${t}<span>EXP ${n}/${g}</span></div><div class="bar">${Array.from({length:12},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('')}</div></div>`}

function renderChips(){const c={all:state.books.length};SECTIONS.forEach(([k])=>c[k]=state.books.filter(b=>b.status===k).length);
  $('#chips').innerHTML=[['all','전체'],...SECTIONS].map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${state.filter===k}">${l}<span class="n">${c[k]}</span></button>`).join('')}

function spineHTML(b,i=0){const L=look(b);const face=L.face&&(L.v===0||L.v===3)&&spineW(b)>=30;
  const deco=L.v===1||L.v===2?'<i class="blk"></i>':L.v===3||L.v===4?'<i class="ln"></i>':'';
  return `<button class="spine v${L.v} ${face?'hasface':''}" data-id="${b.id}" title="${esc(b.title)} · ${esc(b.author)}" style="--i:${i};width:${spineW(b)}px;height:${spineH(b)}px;--c:${L.c};--c2:${L.c2};--ink:${L.ink};--ink2:${L.ink2}">${deco}${b.status==='reading'?'<i class="rib"></i>':''}<span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span>${face?'<span class="face"><i></i><i></i><b></b><s></s><s></s></span>':''}<i class="pub ${L.pub?'sq':''}"></i></button>`}
const pixCache=new Map();
function pixOf(src){if(pixCache.has(src))return pixCache.get(src);pixCache.set(src,null);
  const im=new Image();im.onload=()=>{const w=46,h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;
    const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.drawImage(im,0,0,w,h);pixCache.set(src,c.toDataURL('image/png'));
    if(tab==='shelf'&&state.view==='cover')renderShelves()};im.src=src;return null}
function coverArt(b){if(b.cover){const p=state.skin==='pixel'?pixOf(b.cover):null;return p?`<img class="pix" src="${p}" alt="">`:`<img src="${b.cover}" alt="">`}
  const L=look(b),st=`--c:${L.c};--c2:${L.c2};--ink:${L.ink};--paper:#F6F3EC`;
  if(L.g===0)return `<div class="gen g0" style="${st}"><i class="orb"></i><div class="gt">${esc(b.title)}</div><div class="ga">${esc(b.author)}</div></div>`;
  if(L.g===1)return `<div class="gen g1" style="${st}"><div class="top"></div><i class="stripe"></i><div class="bot"><div class="gt">${esc(b.title)}</div><div class="ga">${esc(b.author)}</div></div></div>`;
  return `<div class="gen g2" style="${st};--ink:${L.ink}"><div class="glyph">${esc([...(b.title||'책')][0])}</div><div class="gt">${esc(b.title)}</div><div class="ga">${esc(b.author)}</div></div>`}
function coverHTML(b,i=0){let sub=b.author||'';
  if(b.status==='done'&&b.finishedAt)sub=`${b.finishedAt.slice(2).replace(/-/g,'.')} 완독`;
  const d=b.status==='reading'&&b.startedAt?days(b.startedAt,today()):null;
  return `<button class="cv" data-id="${b.id}" style="--i:${i}"><div class="art">${coverArt(b)}</div><div class="meta"><b>${esc(b.title)}</b><span>${esc(sub)}</span>${d!==null?` <span class="pill ${d>30?'warn':''}" style="margin-left:4px">${d}일째</span>`:''}</div></button>`}

let animOnce=true;
function renderShelves(anim){
  const secs=state.filter==='all'?SECTIONS:SECTIONS.filter(([k])=>k===state.filter);
  const host=$('#shelves');
  host.innerHTML=secs.map(([k,l])=>{const bs=sorted(k);
    return `<section class="section"><div class="sec-h"><h2>${l}</h2><span>${bs.length}</span><hr></div>${state.view==='spine'?`<div class="case" data-sec="${k}"></div>`:`<div class="covers">${bs.map((b,i)=>coverHTML(b,i)).join('')||'<p class="none">아직 없어요.</p>'}</div>`}</section>`}).join('');
  if(state.view==='spine')host.querySelectorAll('.case').forEach(fillCase);
  if(anim||animOnce){animOnce=false;host.classList.remove('anim');void host.offsetWidth;host.classList.add('anim');clearTimeout(renderShelves._t);renderShelves._t=setTimeout(()=>host.classList.remove('anim'),1600)}
}
function fillCase(el){const bs=sorted(el.dataset.sec);const W=el.clientWidth-8;
  const rows=[];let row=[],w=0,idx=0;
  for(const b of bs){const bw=spineW(b)+2;if(w+bw>W&&row.length){rows.push(row);row=[];w=0}row.push(b);w+=bw}
  rows.push(row);
  const lastW=rows[rows.length-1].reduce((s,b)=>s+spineW(b)+2,0);
  const room=W-lastW>64;
  el.innerHTML=rows.map((r,i)=>`<div class="row">${r.length?r.map(b=>spineHTML(b,idx++)).join(''):'<span class="empty-row">아직 꽂힌 책이 없어요</span>'}${i===rows.length-1&&r.length&&room?'<span class="plant" aria-hidden="true"><i class="lf a1"></i><i class="lf a2"></i><i class="lf a3"></i><span class="pot"></span></span><span class="cat" aria-hidden="true"><i class="spr"></i><i class="bl l"></i><i class="bl r"></i><span class="zz">z</span></span>':''}</div>`).join('')}
let rz;new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(()=>{if(tab==='shelf'&&state.view==='spine')document.querySelectorAll('.case').forEach(fillCase)},80)}).observe($('#shelves'));

/* ───── 통계 ───── */
let statYear=String(new Date().getFullYear());
function renderStats(){
  const done=state.books.filter(b=>b.status==='done'&&b.finishedAt);
  const years=[...new Set([String(new Date().getFullYear()),...done.map(b=>b.finishedAt.slice(0,4))])].sort().reverse();
  if(statYear!=='all'&&!years.includes(statYear))statYear=years[0];
  const all=statYear==='all';
  const set=all?done:done.filter(b=>b.finishedAt.startsWith(statYear));
  const pages=set.reduce((s,b)=>s+(Number(b.pages)||0),0);
  const dur=set.filter(b=>b.startedAt).map(b=>Math.max(1,days(b.startedAt,b.finishedAt)+1));
  const avg=dur.length?Math.round(dur.reduce((a,b)=>a+b,0)/dur.length):0;
  const reading=state.books.filter(b=>b.status==='reading');

  const count=key=>{const m={};set.forEach(b=>{const k=key(b)||'미분류';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const genres=count(b=>b.genre), authors=count(b=>b.author).slice(0,5);

  let goalHTML='';
  if(!all){const isCur=statYear===String(new Date().getFullYear());const n=set.length,g=Math.max(1,state.goal);
    const now=new Date(),dayOfYear=Math.floor((now-new Date(now.getFullYear(),0,1))/86400000)+1;
    const proj=isCur?Math.round(n/dayOfYear*365):n;
    const slots=Math.min(g,80);
    goalHTML=`<div class="blk"><h3>${statYear}년 목표</h3><div class="goal">
      <div class="num">${n} <span>/ ${g}권 · ${Math.round(n/g*100)}%</span></div>
      <div class="shelfbar" aria-hidden="true">${Array.from({length:slots},(_,i)=>`<i class="${i<Math.round(n/g*slots)?'on':''}"></i>`).join('')}</div>
      <div class="row2"><span>${isCur?`지금 속도면 연말까지 약 ${proj}권`:'지난 해 기록'}</span><label>목표 <input id="goal" type="number" min="1" max="999" value="${state.goal}"> 권</label></div></div></div>`}

  let monthHTML='';
  if(!all){const m=Array(12).fill(0);set.forEach(b=>m[Number(b.finishedAt.slice(5,7))-1]++);const mx=Math.max(1,...m);
    const curM=statYear===String(new Date().getFullYear())?new Date().getMonth():-1;
    monthHTML=`<div class="blk"><h3>월별 완독</h3><div class="months">${m.map((v,i)=>`<div class="mcol ${i===curM?'cur':''}"><span class="c">${v||''}</span><div class="b" style="height:${v/mx*100}%"></div></div>`).join('')}</div>
      <div class="mlab">${m.map((_,i)=>`<span>${i+1}</span>`).join('')}</div></div>`}

  let heatHTML='';
  if(!all){const y=Number(statYear),d0=new Date(y,0,1),d1=new Date(y,11,31),t=today();
    const cells=[];for(let i=0;i<d0.getDay();i++)cells.push('<i class="out"></i>');
    const iv=state.books.filter(b=>b.startedAt).map(b=>[b.startedAt,b.finishedAt||(b.status==='reading'?t:b.startedAt)]);
    const fin=new Set(state.books.filter(b=>b.finishedAt).map(b=>b.finishedAt));
    let readDays=0;
    for(let d=new Date(d0);d<=d1;d.setDate(d.getDate()+1)){const s=iso(d);
      if(s>t){cells.push(`<i title="${s}"></i>`);continue}
      const c=iv.filter(([a,b])=>a<=s&&s<=b).length;if(c)readDays++;
      const lv=fin.has(s)?3:c>=2?2:c?1:0;cells.push(`<i class="${lv?'l'+lv:''}" title="${s}${fin.has(s)?' · 완독':c?` · ${c}권 읽는 중`:''}"></i>`)}
    heatHTML=`<div class="blk full"><h3>독서 잔디 · 책을 펼쳐 둔 날 ${readDays}일</h3><div class="heat-scroll"><div class="heat">${cells.join('')}</div></div>
      <div class="heat-legend"><i style="background:var(--heat-0)"></i>쉰 날 <i style="background:var(--heat-1)"></i>1권 읽는 중 <i style="background:var(--heat-2)"></i>2권 이상 <i style="background:var(--heat-3)"></i>완독한 날</div></div>`}

  const tot=set.length||1;
  const genreHTML=`<div class="blk"><h3>장르</h3>${set.length?`<div class="genre-bar">${genres.map(([g,v])=>`<i title="${esc(g)} ${v}권" style="flex:${v};background:${chartColor(g)}"></i>`).join('')}</div>
    <div class="legend">${genres.map(([g,v])=>`<div><i style="background:${chartColor(g)}"></i>${esc(g)}<span>${v}권 · ${Math.round(v/tot*100)}%</span></div>`).join('')}</div>`:'<p class="none">완독한 책이 없어요.</p>'}</div>`;

  const amx=authors[0]?.[1]||1;
  const authorHTML=`<div class="blk"><h3>많이 읽은 작가</h3>${authors.length?`<div class="hbars">${authors.map(([a,v])=>`<div class="hb"><span class="nm">${esc(a)}</span><span class="tr"><i style="width:${v/amx*100}%"></i></span><span class="ct">${v}권</span></div>`).join('')}</div>`:'<p class="none">완독한 책이 없어요.</p>'}</div>`;

  const ym={};done.forEach(b=>{const y=b.finishedAt.slice(0,4);ym[y]=(ym[y]||0)+1});const ys=Object.entries(ym).sort((a,b)=>b[0].localeCompare(a[0]));const ymx=Math.max(1,...ys.map(x=>x[1]));
  const yearHTML=`<div class="blk"><h3>연도별 완독</h3>${ys.length?`<div class="hbars">${ys.map(([y,v])=>`<div class="hb"><span class="nm">${y}년</span><span class="tr"><i style="width:${v/ymx*100}%"></i></span><span class="ct">${v}권</span></div>`).join('')}</div>`:'<p class="none">아직 기록이 없어요.</p>'}</div>`;

  const st=reading.filter(b=>b.startedAt).sort((a,b)=>a.startedAt.localeCompare(b.startedAt));
  const stalledHTML=`<div class="blk"><h3>읽는 중</h3>${st.length?`<div class="stalled">${st.map(b=>{const d=days(b.startedAt,today());return `<button class="st" data-id="${b.id}"><i class="mini" style="background:${look(b).c}"></i><b>${esc(b.title)}</b><span class="hint">${esc(b.author)}</span><span class="pill ${d>30?'warn':''}">${d>30?`${d}일째 멈춤`:`${d}일째`}</span></button>`}).join('')}</div><p class="hint" style="margin-top:10px">시작한 지 30일이 넘으면 주황색으로 알려 드려요.</p>`:'<p class="none">지금 읽는 책이 없어요.</p>'}</div>`;

  $('#view-stats').innerHTML=`<div class="stats-top"><h2>${all?'지금까지의':statYear+'년의'} 독서</h2>
    <select id="year" aria-label="기간">${years.map(y=>`<option value="${y}" ${y===statYear?'selected':''}>${y}년</option>`).join('')}<option value="all" ${all?'selected':''}>전체 기간</option></select></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${set.length}<small>권</small></div><div class="l">완독</div></div>
      <div class="kpi"><div class="v">${pages.toLocaleString()}<small>쪽</small></div><div class="l">읽은 쪽수</div></div>
      <div class="kpi"><div class="v">${avg||'–'}<small>${avg?'일':''}</small></div><div class="l">한 권 완독까지 평균</div></div>
      <div class="kpi"><div class="v">${reading.length}<small>권</small></div><div class="l">지금 읽는 중</div></div>
    </div>
    <div class="grid2">${goalHTML}${monthHTML}${heatHTML}${genreHTML}${authorHTML}${yearHTML}${stalledHTML}</div>`;
}

/* ───── 시트: 추가/수정 ───── */
let draft=null;
function openEdit(id){const b=id?state.books.find(x=>x.id===id):null;
  draft=b?{...b}:{id:uid(),title:'',author:'',genre:'',pages:'',status:'wish',startedAt:'',finishedAt:'',cover:null,addedAt:today()};
  draft._new=!b;draft._confirm=false;renderSheet()}
function renderSheet(){const d=draft;
  $('#modal').innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="form" novalidate>
    <h3>${d._new?'새 책 꽂기':'책 정보'}</h3>
    <div class="f"><label for="f-title">제목</label><input id="f-title" value="${esc(d.title)}" required autocomplete="off"></div>
    <div class="two"><div class="f"><label for="f-author">작가</label><input id="f-author" value="${esc(d.author)}" autocomplete="off"></div>
      <div class="f"><label for="f-genre">장르</label><input id="f-genre" list="genres" value="${esc(d.genre)}" autocomplete="off"><datalist id="genres">${GENRES.map(g=>`<option value="${g}">`).join('')}</datalist></div></div>
    <div class="f"><label>상태</label><div class="seg">${['wish','reading','done'].map(s=>`<button type="button" data-st="${s}" aria-pressed="${d.status===s}">${STATUS_LABEL[s]}</button>`).join('')}</div></div>
    <div class="two">
      <div class="f" ${d.status==='wish'?'hidden':''}><label for="f-start">읽기 시작한 날</label><input id="f-start" type="date" value="${d.startedAt}"></div>
      <div class="f" ${d.status!=='done'?'hidden':''}><label for="f-finish">완독한 날</label><input id="f-finish" type="date" value="${d.finishedAt}"></div>
    </div>
    <div class="two"><div class="f"><label for="f-pages">쪽수</label><input id="f-pages" type="number" min="1" inputmode="numeric" value="${d.pages}"></div>
      <div class="f"><label for="f-cover">표지 사진</label><div class="coverpick"><div class="thumb">${coverArt({...d,title:d.title||'제목'})}</div>
        <div style="display:flex;flex-direction:column;gap:4px;min-width:0"><input id="f-cover" type="file" accept="image/*" style="font-size:12px;max-width:100%">${d.cover?'<button type="button" class="btn del" id="rm-cover" style="padding:0;text-align:left">표지 지우기</button>':'<span class="hint">없으면 자동으로 그려요</span>'}</div></div></div></div>
    <div class="err" id="err"></div>
    <div class="actions">${d._new?'':d._confirm?`<span style="font-size:14px">정말 뺄까요?</span><button type="button" class="btn del" id="del-yes">빼기</button><button type="button" class="btn sec" id="del-no">취소</button>`:'<button type="button" class="btn del" id="del">책장에서 빼기</button>'}
      <button type="button" class="btn sec" id="cancel" ${d._confirm?'hidden':''} style="${d._new?'margin-left:auto':''}">닫기</button><button class="btn pri" type="submit" ${d._confirm?'hidden':''} style="${d._new?'margin-left:0':''}">${d._new?'책장에 꽂기':'저장'}</button></div>
  </form></div>`;
  const keep=()=>{d.title=$('#f-title').value.trim();d.author=$('#f-author').value.trim();d.genre=$('#f-genre').value.trim();d.pages=$('#f-pages').value;
    d.startedAt=$('#f-start').value;d.finishedAt=$('#f-finish').value};
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close()};
  $('#cancel').onclick=close;
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{keep();d.status=b.dataset.st;
    if(d.status!=='wish'&&!d.startedAt)d.startedAt=today();
    if(d.status==='done'&&!d.finishedAt)d.finishedAt=today();
    renderSheet()});
  $('#f-cover').onchange=e=>{const f=e.target.files[0];if(!f)return;keep();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const w=300,h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    d.cover=c.toDataURL('image/jpeg',.82);renderSheet()};im.src=r.result};r.readAsDataURL(f)};
  $('#rm-cover')&&($('#rm-cover').onclick=()=>{keep();d.cover=null;renderSheet()});
  $('#del')&&($('#del').onclick=()=>{keep();d._confirm=true;renderSheet()});
  $('#del-no')&&($('#del-no').onclick=()=>{d._confirm=false;renderSheet()});
  $('#del-yes')&&($('#del-yes').onclick=()=>{state.books=state.books.filter(b=>b.id!==d.id);(state.deleted=state.deleted||{})[d.id]=Date.now();save();close();rerender();toast('책장에서 뺐어요')});
  $('#form').onsubmit=e=>{e.preventDefault();keep();
    if(!d.title){$('#err').textContent='제목을 적어 주세요.';$('#f-title').focus();return}
    if(d.status==='done'&&!d.finishedAt){$('#err').textContent='완독한 날을 골라 주세요.';return}
    if(d.startedAt&&d.finishedAt&&d.finishedAt<d.startedAt){$('#err').textContent='완독한 날이 시작한 날보다 빨라요.';return}
    if(d.status==='wish'){d.startedAt='';d.finishedAt=''} if(d.status==='reading')d.finishedAt='';
    const {_new,_confirm,...book}=d;book.updatedAt=Date.now();const i=state.books.findIndex(b=>b.id===book.id);
    if(i>=0)state.books[i]=book;else state.books.push(book);
    save();close();rerender();toast(_new?'책장에 꽂았어요':'저장했어요')};
  if(d._new)setTimeout(()=>$('#f-title')?.focus(),30);
}
function close(){$('#modal').innerHTML='';draft=null}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)close()});

/* ───── 백업 ───── */
function openBackup(){const json=JSON.stringify({app:'bookquest',version:1,exportedAt:new Date().toISOString(),goal:state.goal,books:state.books});
  $('#modal').innerHTML=`<div class="scrim" id="scrim"><div class="sheet">
    <h3>${SYNC_ON?'동기화 · 백업':'백업'}</h3>${SYNC_ON?syncPanel():''}
    <p class="hint" style="margin:-8px 0 16px">책 기록은 이 브라우저에만 저장돼요. 아래 내용을 복사해 메모나 파일로 보관해 두세요.</p>
    <div class="f"><label for="b-out">내보내기 · ${state.books.length}권</label><textarea id="b-out" readonly>${esc(json)}</textarea></div>
    <div class="actions" style="margin-top:0"><button class="btn sec" id="b-copy">전체 복사</button></div>
    <div class="f" style="margin-top:24px"><label for="b-in">가져오기 · 지금 책장을 덮어써요</label><textarea id="b-in" placeholder="백업한 내용을 붙여 넣거나 아래에서 파일을 고르세요"></textarea><input id="b-file" type="file" accept=".json,.txt,application/json" style="font-size:12px"></div>
    <div class="err" id="b-err"></div>
    <div class="actions"><button class="btn sec" id="b-close" style="margin-left:auto">닫기</button><button class="btn pri" id="b-import" style="margin-left:0">가져오기</button></div>
  </div></div>`;
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close()};$('#b-close').onclick=close;
  if(SYNC_ON)bindSyncPanel();
  $('#b-copy').onclick=()=>{const t=$('#b-out');const fb=()=>{t.select();toast('선택했어요. 길게 눌러 복사하세요')};
    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('복사했어요'),fb);else fb()};
  $('#b-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$('#b-in').value=r.result;r.readAsText(f)};
  $('#b-import').onclick=()=>{try{const o=JSON.parse($('#b-in').value);if(!Array.isArray(o.books))throw 0;
      state.books=o.books.filter(b=>b&&b.title).map(b=>({id:b.id||uid(),title:b.title,author:b.author||'',genre:b.genre||'',pages:b.pages||'',status:['wish','reading','done'].includes(b.status)?b.status:'wish',startedAt:b.startedAt||'',finishedAt:b.finishedAt||'',cover:b.cover||null,addedAt:b.addedAt||today(),updatedAt:Date.now()}));
      if(o.goal){state.goal=o.goal;state.goalAt=Date.now()}state.sample=false;save();close();rerender();toast(`${state.books.length}권을 가져왔어요`)}
    catch(e){$('#b-err').textContent='백업 형식이 아니에요. 내보내기에서 복사한 내용 전체를 붙여 넣어 주세요.'}};
}


/* ───── Gist 동기화 (GitHub Pages 버전에서만 켜짐) ───── */
const SYNC_ON=!!window.BQ_SYNC;
const GH='https://api.github.com', FILE='bookquest.json', CFILE='covers.json';
let syncMsg='', syncBusy=false, syncAgain=false, syncTimer=null;
const sy=()=>state.sync||(state.sync={token:'',gistId:'',last:0});
function setMsg(m,kind){syncMsg=m;const el=$('#sync-msg');if(el){el.textContent=m;el.dataset.k=kind||''}
  const b=$('#btn-backup');if(b)b.dataset.sync=kind||''}
async function gh(path,opt={}){const r=await fetch(GH+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+sy().token,'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok){const e=new Error('http');e.status=r.status;throw e}return r.json()}
async function fileText(f){if(!f)return null;if(f.truncated&&f.raw_url){const r=await fetch(f.raw_url,{cache:'no-store'});return r.text()}return f.content}
function pack(){const covers={},books=state.books.map(b=>{const {cover,...rest}=b;if(cover)covers[b.id]=cover;return rest});
  return {main:JSON.stringify({app:'bookquest',v:1,goal:state.goal,goalAt:state.goalAt||0,deleted:state.deleted||{},books},null,1),covers:JSON.stringify(covers)}}
function mergeIn(remote,rcovers){
  const del={...(remote.deleted||{})};for(const[k,v]of Object.entries(state.deleted||{}))del[k]=Math.max(del[k]||0,v);
  const m=new Map();
  for(const b of (remote.books||[])){m.set(b.id,{...b,cover:rcovers[b.id]||null})}
  for(const b of state.books){const c=m.get(b.id);if(!c||(b.updatedAt||0)>=(c.updatedAt||0))m.set(b.id,b)}
  state.books=[...m.values()].filter(b=>!(del[b.id]&&del[b.id]>=(b.updatedAt||0)));
  const cut=Date.now()-1000*60*60*24*365;for(const k in del)if(del[k]<cut)delete del[k];
  state.deleted=del;
  if((remote.goalAt||0)>(state.goalAt||0)){state.goal=remote.goal;state.goalAt=remote.goalAt}}
async function findOrCreate(){const s=sy();if(s.gistId)return;
  try{const list=await gh('/gists?per_page=100');const g=list.find(x=>x.files&&x.files[FILE]);if(g){s.gistId=g.id;return}}catch(e){if(e.status===401)throw e}
  const p=pack();const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'북퀘스트 독서 기록 (자동 동기화)',public:false,files:{[FILE]:{content:p.main},[CFILE]:{content:p.covers}}})});
  s.gistId=g.id}
async function syncNow(){const s=sy();if(!SYNC_ON||!s.token)return;
  if(syncBusy){syncAgain=true;return}syncBusy=true;setMsg('맞추는 중…','busy');
  try{
    if(!navigator.onLine)throw Object.assign(new Error('off'),{status:0});
    await findOrCreate();
    const g=await gh('/gists/'+s.gistId,{cache:'no-store'});
    const rt=await fileText(g.files[FILE]),rc=await fileText(g.files[CFILE]);
    const before=JSON.stringify(state.books.map(b=>[b.id,b.updatedAt]))+state.goal;
    if(rt)mergeIn(JSON.parse(rt),rc?JSON.parse(rc):{});
    const p=pack(),files={};
    if(p.main!==rt)files[FILE]={content:p.main};
    if(p.covers!==rc)files[CFILE]={content:p.covers};
    if(Object.keys(files).length)await gh('/gists/'+s.gistId,{method:'PATCH',body:JSON.stringify({files})});
    s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    const d=new Date(s.last);setMsg(`동기화됨 · ${pad(d.getHours())}:${pad(d.getMinutes())}`,'ok');
    if(before!==JSON.stringify(state.books.map(b=>[b.id,b.updatedAt]))+state.goal&&!draft)rerender();
  }catch(e){
    const st=e.status;
    setMsg(st===401?'토큰이 맞지 않거나 만료됐어요. 새 토큰을 넣어 주세요.':st===403||st===404?'토큰에 Gist 쓰기 권한이 없거나 Gist를 찾을 수 없어요.':st===0||e instanceof TypeError?'인터넷에 연결되면 다시 맞출게요.':'동기화하지 못했어요. 잠시 후 다시 시도해 주세요.','err');
  }finally{syncBusy=false;if(syncAgain){syncAgain=false;setTimeout(syncNow,300)}}}
function scheduleSync(){if(!SYNC_ON||!sy().token)return;clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500)}
function syncPanel(){const s=sy();
  return `<div class="f"><label for="s-token">기기 간 동기화 · GitHub 토큰</label>
    <input id="s-token" type="password" autocomplete="off" placeholder="github_pat_로 시작하는 토큰" value="${esc(s.token)}">
    <span class="hint">토큰은 이 기기 브라우저에만 저장돼요. 다른 기기에도 같은 토큰을 넣으면 같은 기록을 이어서 써요.</span></div>
    ${s.token?`<div class="f"><label for="s-gist">연결된 Gist ID</label><input id="s-gist" value="${esc(s.gistId)}" autocomplete="off" placeholder="비워 두면 자동으로 찾거나 만들어요"></div>`:''}
    <div class="actions" style="margin-top:0">${s.token?'<button class="btn del" id="s-off">연결 끊기</button><button class="btn sec" id="s-now" style="margin-left:auto">지금 동기화</button>':'<button class="btn pri" id="s-on">연결하기</button>'}</div>
    <p class="hint" id="sync-msg" style="margin:10px 0 22px">${esc(syncMsg||(s.token?'':'연결하면 책을 저장할 때마다 비밀 Gist에 자동으로 올라가요.'))}</p>`}
function bindSyncPanel(){const s=sy();
  $('#s-on')&&($('#s-on').onclick=()=>{const t=$('#s-token').value.trim();if(!t){setMsg('토큰을 붙여 넣어 주세요.','err');return}
    if(state.sample){state.books=[];state.sample=false}
    s.token=t;s.gistId='';save();openBackup();syncNow()});
  $('#s-now')&&($('#s-now').onclick=()=>{const t=$('#s-token').value.trim(),gid=($('#s-gist').value||'').trim();
    if(t!==s.token||gid!==s.gistId){s.token=t;s.gistId=gid}save();syncNow()});
  $('#s-off')&&($('#s-off').onclick=()=>{state.sync={token:'',gistId:'',last:0};syncMsg='연결을 끊었어요. 이 기기의 기록은 그대로 남아 있어요.';
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}openBackup();setMsg(syncMsg,'')})}
if(SYNC_ON)$('#btn-backup').textContent='동기화';
if(SYNC_ON){addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
  if(sy().token)setTimeout(syncNow,400)}

/* ───── 연결 ───── */
function rerender(){$('#banner').hidden=!state.sample;renderChips();
  if(tab==='shelf'){renderHero();renderShelves()}else renderStats()}
function setTab(t){tab=t;$('#tab-shelf').setAttribute('aria-selected',t==='shelf');$('#tab-stats').setAttribute('aria-selected',t==='stats');
  $('#view-shelf').hidden=t!=='shelf';$('#view-stats').hidden=t!=='stats';rerender();window.scrollTo(0,0)}
$('#tab-shelf').onclick=()=>{animOnce=true;setTab('shelf')};$('#tab-stats').onclick=()=>setTab('stats');
$('#fab').onclick=()=>openEdit(null);$('#btn-backup').onclick=openBackup;
$('#btn-clear-sample').onclick=()=>{state.books=[];state.sample=false;save();rerender();toast('빈 책장에서 시작해요')};
$('#chips').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;state.filter=b.dataset.f;save();rerender()};
$('#v-spine').onclick=()=>{state.view='spine';syncView();save();renderShelves(true)};
$('#v-cover').onclick=()=>{state.view='cover';syncView();save();renderShelves(true)};
function syncView(){$('#v-spine').setAttribute('aria-pressed',state.view==='spine');$('#v-cover').setAttribute('aria-pressed',state.view==='cover')}
document.addEventListener('click',e=>{const b=e.target.closest('.spine,.cv,.st');if(b&&b.dataset.id)openEdit(b.dataset.id)});
$('#view-stats').addEventListener('change',e=>{if(e.target.id==='year'){statYear=e.target.value;renderStats()}
  if(e.target.id==='goal'){const v=parseInt(e.target.value);if(v>0){state.goal=v;state.goalAt=Date.now();save();renderStats()}}});

const CAT=[
'.k........k.',
'kok......kok',
'kookkkkkkook',
'kooooooooook',
'kokkooookkok',
'kokkooookkok',
'kpoookkooopk',
'.kooooooook.',
'.koowwwwook.',
'kooowwwwoook',
'kooowwwwoook',
'.kkkkkkkkkk.'];
(()=>{const C={k:'#1B1B2F',o:'#F2A33A',w:'#FFF4E0',p:'#FF8FB1'};const sh=[];
  CAT.forEach((r,y)=>[...r].forEach((ch,x)=>{if(C[ch])sh.push(`${x*3}px ${y*3}px 0 0 ${C[ch]}`)}));
  document.documentElement.style.setProperty('--cat',sh.join(','))})();
function applySkin(){const px=state.skin==='pixel';$('#skin-pixel').disabled=!px;document.documentElement.dataset.skin=state.skin;
  $('#sk-cute').setAttribute('aria-pressed',!px);$('#sk-pixel').setAttribute('aria-pressed',px)}
$('#sk-cute').onclick=()=>{state.skin='cute';save();applySkin();animOnce=true;rerender()};
$('#sk-pixel').onclick=()=>{state.skin='pixel';save();applySkin();animOnce=true;rerender()};
applySkin();syncView();rerender();
})();
</script>
